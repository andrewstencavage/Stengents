[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stengents"
version = "0.1.0"
description = "Reproducible evidence harnesses for coding agents"
requires-python = ">=3.11"
dependencies = [
  "google-adk",
  "litellm",
  "playwright",
  "pydantic>=2",
]

[project.scripts]
stengents = "stengents.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Test the checkout's own src (this file's directory), not wherever an editable
# install happens to point — so the suite is correct in a git worktree too.
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/stengents"]
